
name: Build SWFPlayer PSP

on:
  workflow_dispatch:
  push:
    branches: [main, fix/psp-build-includes]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4


      - name: Diagnosticar PSPDEV
        run: |
          docker run --rm pspdev/pspdev:latest sh -lc '
            echo "=== PSPDEV ==="
            echo "PSPDEV=$PSPDEV"
            echo "PATH=$PATH"
            echo "=== psp-config ==="
            command -v psp-config || true
            echo "=== bin ==="
            ls -la /usr/local/pspdev/bin || true
            echo "=== arquivos do SDK ==="
            find /usr/local/pspdev \
              \( -name psp-config -o -name build.mak \) \
              -print 2>/dev/null
          '

      - name: Preparar dependencias
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            pspdev/pspdev:latest \
            sh -lc '
              export PATH="$PSPDEV/bin:$PATH"

              echo "=== Instalando SDL_mixer ==="
              psp-pacman -Sy --noconfirm sdl-mixer

              echo "=== Procurando gameswf.h ==="
              find Source/GameSWF -iname "gameswf.h" -print

              echo "=== Procurando SDL_mixer.h ==="
              find "$PSPDEV" -iname "SDL_mixer.h" -print

              echo "=== Estrutura GameSWF ==="
              find Source/GameSWF -maxdepth 2 -type d -print
            '
          
      - name: Compilar para PSP
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            pspdev/pspdev:latest \
            sh -lc '
              export PATH="$PSPDEV/bin:$PATH"

              echo "=== Instalando dependencias para compilacao ==="
              psp-pacman -Sy --noconfirm sdl-mixer libpng libvorbis libogg pspirkeyb || exit 1

              echo "=== Verificando cabecalhos libpng ==="
              find "$PSPDEV/psp" \( -name png.h -o -name pnglibconf.h \) -print

              echo "=== Recompilando somente o registro de codecs ==="
              make -C third_party/ffmpeg/libavcodec allcodecs.o || exit 1

              echo "=== Removendo FAAD da biblioteca FFmpeg ==="
              psp-ar d third_party/ffmpeg/libavcodec/libavcodec.a libfaad.o || exit 1
              psp-ar d third_party/ffmpeg/libavcodec/libavcodec.a allcodecs.o || exit 1
              psp-ar r third_party/ffmpeg/libavcodec/libavcodec.a third_party/ffmpeg/libavcodec/allcodecs.o || exit 1
              psp-ranlib third_party/ffmpeg/libavcodec/libavcodec.a || exit 1

              if psp-ar t third_party/ffmpeg/libavcodec/libavcodec.a | grep -q '^libfaad.o$'; then
                echo "ERRO: libfaad.o ainda está na biblioteca."
                exit 1
              fi

              echo "=== FAAD removido; codecs restantes preservados ==="

              echo "=== Compilando ==="
              make -j2
            '

      - name: Salvar executavel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SWFPlayer-build
          path: |
            EBOOT.PBP
            SWFPlayer/
          if-no-files-found: warn
          

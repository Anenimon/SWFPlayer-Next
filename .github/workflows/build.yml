
name: Build SWFPlayer PSP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar para PSP
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            pspdev/pspdev:latest \
            sh -lc "make -j2"

      - name: Salvar executavel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SWFPlayer-build
          path: |
            EBOOT.PBP
            SWFPlayer/
          if-no-files-found: warn
          
